services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkafu-app
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    command: yarn start
    ports:
      - "4000:4000"
    depends_on:
      - db
    env_file:
      - .env.prod
    restart: always

  db:
    image: postgres:13
    container_name: nkafu-db
    env_file:
      - .env.prod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: nkafu-pgadmin
    env_file:
      - .env.prod
    ports:
      - "5051:80"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
  app_images:
    driver: local
